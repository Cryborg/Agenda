<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131314" />
    <meta name="color-scheme" content="dark" />
    <title>Agenda</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu"></button>
        <div class="brand">
          <img src="icons/icon.svg" alt="" width="28" height="28" />
          <span>Agenda</span>
        </div>
        <button class="btn btn-outline" id="btn-today">Aujourd'hui</button>
        <div class="nav-arrows">
          <button class="icon-btn" id="btn-prev" aria-label="Précédent"></button>
          <button class="icon-btn" id="btn-next" aria-label="Suivant"></button>
        </div>
        <h1 class="period" id="period"></h1>
        <div class="spacer"></div>
        <button class="icon-btn" id="btn-sync" aria-label="Actualiser"></button>
        <button class="icon-btn" id="btn-settings" aria-label="Paramètres"></button>
        <div class="views" id="views" role="tablist" aria-label="Vue">
          <button data-view="day" role="tab">Jour</button>
          <button data-view="3days" role="tab">3 jours</button>
          <button data-view="week" role="tab">Semaine</button>
          <button data-view="month" role="tab">Mois</button>
        </div>
        <select class="views-select" id="views-select" aria-label="Vue">
          <option value="day">Jour</option>
          <option value="3days">3 jours</option>
          <option value="week">Semaine</option>
          <option value="month">Mois</option>
        </select>
      </header>

      <div class="banner" id="banner" hidden></div>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <button class="btn btn-create" id="btn-create"><span class="create-icon"></span>Créer</button>
          <div class="mini" id="mini"></div>
          <section class="side-section">
            <h2>Agendas</h2>
            <ul class="cal-list" id="cal-list"></ul>
          </section>
          <section class="side-section">
            <h2>
              Personnes
              <button class="link-btn" id="btn-people-all" hidden>Tout afficher</button>
            </h2>
            <ul class="cal-list" id="people-list"></ul>
          </section>
          <section class="side-section source" id="source"></section>
          <button class="btn btn-ghost side-settings" id="btn-settings-side">Paramètres</button>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <main class="main" id="main"></main>
      </div>
    </div>

    <div class="popover" id="popover" hidden></div>
    <dialog class="dialog" id="editor"></dialog>
    <dialog class="dialog" id="settings"></dialog>
    <dialog class="dialog dialog-small" id="confirm"></dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
